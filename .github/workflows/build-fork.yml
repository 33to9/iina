name: Build (fork)

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ['build/**']

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

      - name: Install dependencies
        run: ./other/download_libs.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: xcodebuild -project iina.xcodeproj ONLY_ACTIVE_ARCH=NO -scheme iina -derivedDataPath . -configuration Nightly
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

      - name: Create DMG
        run: hdiutil create -volname "IINA (record-last-played-file)" -srcfolder Build/Products/Nightly/IINA.app -ov -format UDZO IINA.dmg

      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: IINA
          path: IINA.dmg
          archive: false
